[package]
name = "fluxia"
version = "0.4.0"
edition = "2021"
description = "Клиент Яндекс Музыки для Windows"
authors = ["pryanostnik"]
license = "MIT"
repository = "https://github.com/pryanostnik/fluxia"
readme = "README.md"

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links"] }
yandex-music = "0.7"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
